[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "debatebench"
version = "0.1.0.dev0"
description = "Structured, multi-turn adversarial LLM debates, scored against a fixed rubric."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Robert E. Roy", email = "me@robert-e-roy.com" }]
keywords = ["llm", "debate", "evaluation", "benchmark", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# No [project.urls] yet: this project has no public repository, and a link that
# does not resolve is worse than none.
# ADR-008: these two and nothing else without an ADR.
dependencies = [
    "httpx>=0.28",
    "PyYAML>=6.0",
]

[project.scripts]
debate = "debatebench.cli:main"
judge = "debatebench.judge_cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
